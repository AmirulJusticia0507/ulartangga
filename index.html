<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Ular Tangga — Snake 'n Ladder</title>
  <meta name="description" content="Permainan ular tangga modern: lawan teman atau AI di papan 100 kotak.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>
<div class="confetti" id="confetti" aria-hidden="true"></div>

<div class="app">
  <header class="app-header">
    <div class="brand">
      <div class="brand__mark" aria-hidden="true">🎲</div>
      <div>
        <h1 class="brand__title">Ular Tangga</h1>
        <p class="brand__sub">Naik tangga, hindari ular, capai kotak 100.</p>
      </div>
    </div>
    <button class="icon-btn" id="themeToggle" type="button" aria-label="Ganti tema terang/gelap">🌙</button>
  </header>

  <main class="layout">
    <section class="card board-card">
      <div class="card__head">
        <h2 class="card__title">Papan Main</h2>
        <div class="turn-badge" id="turnBadge" style="--c1: var(--muted)">
          <span class="turn-badge__dot" aria-hidden="true"></span>
          <span class="turn-badge__name" id="turnName" aria-live="polite">Belum mulai</span>
        </div>
      </div>

      <div class="board-wrap" id="boardWrap">
        <svg class="board-links" id="boardLinks" aria-hidden="true" preserveAspectRatio="none"></svg>
        <div class="board-decor" id="boardDecor" aria-hidden="true"></div>
        <div class="board" id="board" role="grid" aria-label="Papan ular tangga 100 kotak"></div>
        <div class="board-hint" id="boardHint">
          <div>
            <span>Pilih mode permainan untuk mulai</span>
            <small>Pemain 1 vs Pemain 2, atau lawan AI Computer</small>
          </div>
        </div>
      </div>
    </section>

    <aside class="stack">
      <section class="card">
        <div class="card__head"><h2 class="card__title">Mode</h2></div>
        <div class="segmented">
          <button type="button" id="pvpMode" aria-pressed="false">
            <span aria-hidden="true">👥</span> 2 Pemain
          </button>
          <button type="button" id="vsComputer" aria-pressed="false">
            <span aria-hidden="true">🤖</span> Vs AI
          </button>
        </div>
      </section>

      <section class="card">
        <div class="card__head"><h2 class="card__title">Pemain</h2></div>
        <div class="players" id="players"></div>
      </section>

      <section class="card">
        <div class="card__head"><h2 class="card__title">Lemparan</h2></div>
        <div class="dice-area">
          <div class="dice-pair">
            <div class="die is-idle" id="die1" aria-label="Dadu pertama"></div>
            <div class="die is-idle" id="die2" aria-label="Dadu kedua"></div>
          </div>
          <div class="dice-total">
            <div class="dice-total__value" id="totalDice" aria-live="polite">—</div>
            <div class="dice-total__label">Total</div>
          </div>
        </div>
      </section>

      <section class="card">
        <div class="actions">
          <button class="btn" id="rollDice" type="button" disabled>
            <span aria-hidden="true">🎲</span> Lempar Dadu
            <span class="btn__key" aria-hidden="true">SPACE</span>
          </button>
          <button class="btn btn--ghost" id="resetGame" type="button" aria-label="Reset permainan">🔄</button>
        </div>
      </section>

      <section class="card">
        <div class="card__head"><h2 class="card__title">🏆 Leaderboard</h2></div>
        <div class="rank-list" id="leaderboardList"></div>
      </section>

      <section class="card">
        <div class="card__head"><h2 class="card__title">Riwayat</h2></div>
        <div class="log" id="logList"></div>
      </section>
    </aside>
  </main>

  <footer class="app-footer">© 2025 Amirul Putra Justicia — Snake 'n Ladder</footer>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- Scripts - Load modular components -->
<script src="js/config.js"></script>
<script src="js/state.js"></script>
<script src="js/utils.js"></script>
<script src="js/board.js"></script>
<script src="js/render.js"></script>
<script src="js/dice.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>
</body>
</html>
